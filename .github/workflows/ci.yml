name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Import check
        run: uv run python -c "import voice_asr.daemon, voice_asr.mcp_server, voice_asr.check; print('imports ok')"

[project]
name = "voice-asr"
version = "0.2.0"
description = "Offline voice control for OpenCode (PTT -> SenseVoice -> session prompt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sherpa-onnx>=1.12.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "soxr>=0.5.0",
    "mcp>=1.9,<2",
    "pynput>=1.7.7",
    "httpx>=0.27",
]

[project.scripts]
voice-daemon = "voice_asr.daemon:main"
voice-mcp = "voice_asr.mcp_server:main"
voice-check = "voice_asr.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_asr"]
